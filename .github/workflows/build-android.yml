
name: Build RAP EMPIRE Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      -       - name: Instalacja Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Sprawdzenie plików projektu
        run: |
          test -d android || {
            echo "ERROR: Brak katalogu android"
            exit 1
          }

          test -f android/gradlew || {
            echo "ERROR: Brak pliku gradlew"
            exit 1
          }

          test -f index.html || {
            echo "ERROR: Brak index.html w katalogu glownym"
            exit 1
          }

      - name: Kopiowanie plikow gry
        run: |
          mkdir -p android/app/src/main/assets/public

          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='android/' \
            --exclude='node_modules/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='capacitor.config.*' \
            ./ android/app/src/main/assets/public/

      - name: Kompilacja aplikacji Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Sprawdzenie pliku APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Zapisanie APK
        uses: actions/upload-artifact@v4
        with:
          name: RAP-EMPIRE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
