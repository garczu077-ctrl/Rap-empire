name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Klonowanie repozytorium
        uses: actions/checkout@v4

      - name: Instalacja Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Pobranie zależności i budowanie projektu Capacitora
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p android/app/src/main/assets/public
          cp -r *.html *.png android/app/src/main/assets/public/ 2>/dev/null || true
          npx cap sync android

      - name: Nadanie uprawnień i kompilacja APK przez Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Zapisanie pliku APK jako artefaktu
        uses: actions/upload-artifact@v4
        with:
          name: rap-empire-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
